
services:
  db:
    image: postgres:16-alpine
    container_name: tenantflow-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_admin_password
      POSTGRES_DB: tenantflow

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenantflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
